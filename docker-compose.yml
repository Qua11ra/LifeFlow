  db:
    image: postgres:18-alpine
    container_name: LifeFlow_DB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: LifeFlow_DB
    ports:
      - "5432:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data #//TODO switch to postgres-data

